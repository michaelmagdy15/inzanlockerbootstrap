<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Inzan Athletics - Onboarding Pass</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Syncopate:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Premium Preloader -->
  <div id="preloader">
    <div class="preloader-content">
      <div class="preloader-logo">
        <svg viewBox="0 0 336 40" class="inzan-logo-svg">
          <path class="letter-i" d="M 15 0 L 15 40" />
          <path class="letter-n1" d="M 54 40 L 54 0 L 84 40 L 84 0" />
          <path class="letter-z" d="M 138 0 L 168 0 L 138 40 L 168 40" />
          <path class="letter-l" d="M 222 40 L 237 0 L 252 40" />
          <path class="letter-n2" d="M 306 40 L 306 0 L 336 40 L 336 0" />
        </svg>
      </div>
      <div class="preloader-loader-bar">
        <div class="preloader-loader-progress"></div>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener('load', () => {
      const preloader = document.getElementById('preloader');
      if (preloader) {
        const minPlayTime = 1600;
        const timeElapsed = performance.now();
        const remainingTime = Math.max(0, minPlayTime - timeElapsed);
        setTimeout(() => {
          preloader.classList.add('fade-out');
          setTimeout(() => preloader.remove(), 600);
        }, remainingTime);
      }
    });
  </script>

  <div class="app-container pwa-mobile-container">
    <header class="header">
      <div class="logo-container">
        <div class="gym-pfp">
          <img src="/images/logo.png" alt="Inzan Athletics Logo" class="gym-pfp-img">
        </div>
        <div class="brand-text-wrapper">
          <span class="logo-text-primary">I N Z Λ N</span>
          <span class="logo-text-sub">ATHLETICS</span>
        </div>
      </div>
      <div class="system-status">
        <span class="status-indicator online"></span>
        <span class="status-text">Pass Center</span>
      </div>
    </header>

    <main class="pass-wrapper">
      <div class="glass-card" style="padding: 24px; text-align: center;">
        <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; color: #ffffff;">Locker Pass Portal</h2>
        <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5;">Enter your Member credentials to issue your smartphone Locker Pass ticket:</p>

        <form id="passForm" style="display: flex; flex-direction: column; gap: 16px; text-align: left;">
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary);">MEMBER ID</label>
            <input type="text" id="memberId" required placeholder="e.g. MEM-001" style="background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; color: var(--text-primary); font-family: inherit; font-size: 14px;">
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px;">
            <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary);">LAST NAME</label>
            <input type="text" id="lastName" required placeholder="e.g. Smith" style="background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; color: var(--text-primary); font-family: inherit; font-size: 14px;">
          </div>

          <button type="submit" class="submit-btn" style="width: 100%; height: 48px; font-weight: 800; text-transform: uppercase; font-size: 13px; letter-spacing: 0.05em; display: flex; justify-content: center; align-items: center;">
            Generate pass
          </button>
        </form>

        <div id="errorMsg" class="hidden" style="margin-top: 16px; padding: 12px; border-radius: 8px; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--accent-red); color: var(--accent-red); font-size: 12px; text-align: left; line-height: 1.4;"></div>

        <div id="successBox" class="hidden" style="margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 20px;">
          <p style="font-size: 13px; color: var(--accent-green); font-weight: 600; margin-bottom: 16px;">Pass successfully issued!</p>
          <div id="passActions" style="display: flex; flex-direction: column; gap: 12px; align-items: center;">
            <!-- Render Apple Wallet pass button -->
          </div>
        </div>
      </div>
    </main>
    <div class="toast-container" id="toast-container"></div>
  </div>

  <script>
    document.getElementById('passForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const memberId = document.getElementById('memberId').value;
      const lastName = document.getElementById('lastName').value;
      const errorMsg = document.getElementById('errorMsg');
      const successBox = document.getElementById('successBox');
      const passActions = document.getElementById('passActions');

      errorMsg.classList.add('hidden');
      successBox.classList.add('hidden');

      try {
        const response = await fetch('/api/member/issue-pass', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ memberId, lastName })
        });
        const data = await response.json();
        
        if (response.ok && data.success) {
          successBox.classList.remove('hidden');
          
          passActions.innerHTML = `
            <a href="${data.walletUrl}" class="wallet-btn apple-wallet" style="width: 100%; text-decoration: none; display: flex; justify-content: center; align-items: center; gap: 8px; height: 48px; border-radius: 8px; font-weight: bold; background: #000000; border: 1px solid #ffffff; color: #ffffff;">
              <svg class="apple-logo-svg" viewBox="0 0 170 170" width="14" height="14" fill="currentColor" style="vertical-align: middle;">
                <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.34.13-9.13-1.92-14.37-6.15-2.73-2.22-6.5-6.7-11.3-13.43-5.91-8.3-10.74-17.75-14.48-28.37-3.74-10.61-5.63-20.94-5.63-30.98 0-14.9 3.93-27.14 11.79-36.7 7.86-9.57 17.65-14.37 29.37-14.42 6.06 0 12.1 1.77 18.12 5.3 6.02 3.53 10.23 5.3 12.63 5.3 2.1 0 6.07-1.63 11.92-4.89 5.85-3.27 11.66-4.83 17.44-4.7 14.8.25 26.28 5.76 34.42 16.53-12.14 7.36-18.12 17.22-17.94 29.57.19 9.8 3.82 17.89 10.9 24.26 7.07 6.38 15.35 9.87 24.84 10.49-2.07 6.13-4.56 12.23-7.48 18.28zM119.22 32.4c0-7.72 2.76-14.88 8.28-21.49 5.51-6.61 12.43-10.63 20.74-11.06.12.85.19 1.83.19 2.94 0 7.42-2.82 14.4-8.48 20.93-5.65 6.54-12.67 10.65-21.05 10.35-.12-.57-.18-1.12-.18-1.67z"/>
              </svg>
              Add to Phone Wallet
            </a>
            <div style="margin-top: 12px; font-size: 12px; color: var(--text-secondary); word-break: break-all; text-align: center; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px;">
              Locker Token Code:<br>
              <strong style="color: var(--accent-cyan); font-family: monospace; font-size: 13px;">${data.locker_token}</strong>
            </div>
          `;
          
          // Redirect the member to PassKit's unified download page immediately
          setTimeout(() => {
            window.location.href = data.walletUrl;
          }, 800);
        } else {
          errorMsg.textContent = data.message || 'Pass issuance failed.';
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = 'Server connection error.';
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
